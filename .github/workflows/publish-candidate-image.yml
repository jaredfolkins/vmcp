name: Publish candidate image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/jaredfolkins/vmcp
      SOURCE_COMMIT: d53d7969c04f544543a1b0c5b9f6e37f4df9a0a0
    steps:
      - name: Check out the exact source commit
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin https://github.com/jaredfolkins/vmcp.git
          git -C source fetch --depth=1 origin "${SOURCE_COMMIT}"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "${SOURCE_COMMIT}"

      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" |
            docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build and publish the candidate image
        run: |
          set -euo pipefail
          reference="${IMAGE}:${SOURCE_COMMIT}"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --label org.opencontainers.image.source=https://github.com/jaredfolkins/vmcp \
            --label "org.opencontainers.image.revision=${SOURCE_COMMIT}" \
            --tag "${reference}" \
            --push \
            source

          digest="$(
            docker buildx imagetools inspect "${reference}" |
              awk '$1 == "Digest:" {print $2; exit}'
          )"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Published `%s@%s`\n' "${IMAGE}" "${digest}" >>"${GITHUB_STEP_SUMMARY}"
